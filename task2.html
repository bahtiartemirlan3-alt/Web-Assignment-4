<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 2 - Bootstrap Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Assignment 4</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Task 0</a></li>
        <li class="nav-item"><a class="nav-link" href="task1.html">Task 1</a></li>
        <li class="nav-item"><a class="nav-link" href="task2.html">Task 2</a></li>
        <li class="nav-item"><a class="nav-link" href="task3.html">Task 3</a></li>
        <li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>Task 2. Bootstrap Form Styling</h1>

    <form action="#" method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" placeholder="Enter your name">
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="name@example.com">
          <div class="form-text">We will never share your email.</div>
        </div>

        <div class="col-12">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="4" placeholder="Write your message"></textarea>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </form>
  </div>

</body>
</html>
