<body>

      <a class="navbar-brand" href="index.html">Assignment 4</a>

      </ul>

  </nav>

  <div class="container mt-4">
    <h1>Task 3. Bootstrap Validation Styles</h1>
    <p>
      Here the classes <code>is-valid</code> (green) and <code>is-invalid</code> (red) are written
      directly in HTML to show both states.
    </p>

    <form action="#" method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control is-valid" id="name" value="Aigerim" required>
          <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control is-invalid" id="email" value="aigerim.mail" required>
          <div class="invalid-feedback">Email is not correct. Example: name@mail.com</div>
        </div>

        <div class="col-12">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control is-invalid" id="message" rows="4" required></textarea>
          <div class="invalid-feedback">Message is required.</div>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </form>
  </div>

</body>
</html>
